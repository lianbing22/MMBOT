# MMBOT 离线/内网部署编排。完整步骤见 deploy/README.zh.md。
#
# 设计前提：
#   1. 镜像已由 `deploy/install.sh load` 在离线主机 `docker load` 完成，
#      因此所有服务都是 pull_policy: never —— 这里不会、也不该联网拉镜像。
#   2. 模型走 OpenAI 兼容网关。网关地址/密钥在 deploy/.env，首次启动前由 install.sh
#      写入 DATA_DIR/cordis.patch.yml（DSH 的 home 层配置）。
#   3. 默认只把 Web 端口绑到 127.0.0.1，对外访问走 `--profile proxy` 的 nginx（TLS 终止）。
#
# 常用命令（在仓库根目录执行）：
#   docker compose -f deploy/compose.offline.yml --env-file deploy/.env up -d
#   docker compose -f deploy/compose.offline.yml --env-file deploy/.env logs -f ds-bot
#   docker compose -f deploy/compose.offline.yml --env-file deploy/.env --profile proxy up -d
name: mmbot

services:
  ds-bot:
    image: ${MMBOT_IMAGE:-ds-bot:local}
    pull_policy: never
    ports:
      - "${MMBOT_BIND_ADDRESS:-127.0.0.1}:${MMBOT_PORT:-3080}:3080"
    env_file:
      - path: .env
        required: false
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # dsh web 只信任 DSH_TRUSTED_HOST 里的 Host；反向代理必须原样透传浏览器域名。
      DSH_TRUSTED_HOST: ${DSH_TRUSTED_HOST:-localhost,127.0.0.1}
      DSH_HOST: "0.0.0.0"
      DSH_LISTEN_PORT: "3080"
      DSH_TELEMETRY_DISABLED: ${DSH_TELEMETRY_DISABLED:-1}
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${WORKSPACE_DIR:-./workspace}:/workspace
    # 模型网关跑在宿主机（而非容器网络内）时，容器用 host.docker.internal 访问它。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # 首次启动要初始化数据卷并重装插件，给足 start_period，避免被误判为故障。
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3080/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s
    restart: unless-stopped
    stop_grace_period: 15s

  # 可选反向代理：只有显式 `--profile proxy` 时启动。
  # TLS 证书放进 MMBOT_TLS_DIR（fullchain.pem + privkey.pem），nginx.conf 见 deploy/proxy/。
  proxy:
    image: ${MMBOT_PROXY_IMAGE:-nginx:1.27-alpine}
    pull_policy: never
    profiles: ["proxy"]
    depends_on:
      - ds-bot
    ports:
      - "${MMBOT_TLS_PORT:-443}:8443"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${MMBOT_TLS_DIR:-./proxy/tls}:/etc/nginx/tls:ro
    restart: unless-stopped

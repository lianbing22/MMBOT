# MMBOT 反向代理：TLS 终止 + WebSocket 升级。
# 由 deploy/compose.offline.yml 的 proxy 服务挂载到 /etc/nginx/conf.d/default.conf，
# 证书目录（fullchain.pem / privkey.pem）挂载到 /etc/nginx/tls。
#
# 注意：dsh web 会校验每个 /api 请求的 Host 头，因此这里必须原样透传浏览器域名，
# 并把该域名（不带端口）写进 deploy/.env 的 DSH_TRUSTED_HOST，否则接口返回 403。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 附件与图片上传。
    client_max_body_size 100m;

    location / {
        proxy_pass http://ds-bot:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 模型流式回复与长任务不能缓冲、不能按默认 60s 超时断开。
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
